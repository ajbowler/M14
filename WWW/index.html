<!DOCTYPE html>
<html>
  <head>
    <script>
      var ws = new WebSocket('ws://10.30.121.50:1234', 'echo-protocol');

      function sendMessage(message){
        // var message = document.getElementById('message').value;
        ws.send(message);
      }

      ws.addEventListener("message", function(e) {
          // The data is simply the message that we're sending back
          var msg = e.data;

          // Append the message
          document.getElementById('ws-messages').innerHTML += '<br>' + msg;
      });
    </script>
  </head>
  <body>
    <div id="hello"></div></br>
    <div id="checkbox"></div></br>
    <div id="alert"></div>
    <div id="audio"></div>
    <input type="button" value="Status" onclick="sendMessage('status')">
    <input type="button" value="Song Info" onclick="sendMessage('currentsong')">
    <input type="button" value="Pause" onclick="sendMessage('pause 1')">
    <input type="button" value="Resume" onclick="sendMessage('pause 0')">
    <div id="ws-messages"></div>
    <script type="text/javascript" src="js/build/bundle.js"></script>
  </body>
</html>
